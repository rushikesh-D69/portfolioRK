<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activate portfolio contact form</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0f;
        color: #e5e7eb;
        padding: 24px;
      }
      main {
        max-width: 420px;
        width: 100%;
        background: #12121a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 28px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: #9ca3af;
        line-height: 1.5;
        margin: 0 0 20px;
        font-size: 0.95rem;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: #6366f1;
        color: white;
      }
      button:hover {
        background: #818cf8;
      }
      .note {
        margin-top: 16px;
        font-size: 0.85rem;
      }
      a {
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Activate FormSubmit</h1>
      <p>
        Click below to send a one-time activation request to
        <strong>drushikesh0105@gmail.com</strong>. FormSubmit will email you an
        <strong>Activate Form</strong> link — check Spam and All Mail if you do not see it within a few minutes.
      </p>
      <form
        action="https://formsubmit.co/drushikesh0105@gmail.com"
        method="POST"
      >
        <input type="hidden" name="_subject" value="Portfolio contact form activation" />
        <input type="hidden" name="_template" value="table" />
        <input
          type="hidden"
          name="_url"
          value="https://rushikesh-D69.github.io/portfolioRK/form-activate.html"
        />
        <input
          type="hidden"
          name="_next"
          value="https://rushikesh-D69.github.io/portfolioRK/form-activate.html?sent=1"
        />
        <input type="hidden" name="name" value="Rushikesh D" />
        <input type="hidden" name="email" value="drushikesh0105@gmail.com" />
        <input type="hidden" name="subject" value="Form activation" />
        <input
          type="hidden"
          name="message"
          value="One-time activation for portfolio contact form at rushikesh-D69.github.io/portfolioRK"
        />
        <button type="submit">Send activation email</button>
      </form>
      <p class="note">
        After activating, return to the
        <a href="https://rushikesh-D69.github.io/portfolioRK/#contact">contact section</a>.
      </p>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("sent") === "1") {
        document.querySelector("p").textContent =
          "Request sent. Check drushikesh0105@gmail.com (Spam / All Mail) for an email from FormSubmit and click Activate Form.";
      }
    </script>
  </body>
</html>
